<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام محاضر الاجتماعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap">
<style>
:root{--primary:#0f766e;--bg:#f4f6f8;--text:#1f2937;--font:'Cairo';--fs:16px;--card:#fff;--line:#dfe3e8;--muted:#6b7280;--danger:#b91c1c}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .6rem;line-height:1.4}
.hidden{display:none!important}
.muted{color:var(--muted)}
.ico{font-style:normal}

.topbar{background:var(--primary);color:#fff;display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.15rem;margin-inline-end:auto}
.brand img{height:34px;border-radius:6px;background:#fff;padding:2px}
.nav{display:flex;gap:.25rem;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#fff;padding:.4rem .75rem;border-radius:8px;cursor:pointer;opacity:.9}
.nav button:hover,.nav button.on{background:rgba(255,255,255,.2);opacity:1}
.demo{background:#fef3c7;color:#92400e;text-align:center;padding:.35rem 1rem;font-size:.88rem}

main{max-width:1050px;margin:0 auto;padding:1.25rem 1rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card>h3{color:var(--primary);display:flex;align-items:center;gap:.4rem;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:.2rem}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;background:#fff;color:#1f2937}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
textarea{min-height:95px;resize:vertical}
input[type=color]{padding:.15rem;height:2.4rem}
input[readonly]{background:#f3f4f6}

.btn{background:var(--primary);color:#fff;border:0;border-radius:9px;padding:.5rem 1rem;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.soft{background:#eef1f4;color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:.25rem .65rem;font-size:.85rem}
.x{background:#fee2e2;color:var(--danger);border:0;border-radius:8px;width:2.2rem;height:2.2rem;cursor:pointer;flex:none}

.auth{max-width:440px;margin:6vh auto}
.auth .logo{text-align:center;font-size:3rem;line-height:1}
.auth .logo img{max-height:80px}
.auth h1{text-align:center;color:var(--primary);font-size:1.5rem}
.auth .field{margin-bottom:.75rem}
.auth .btn{width:100%;padding:.65rem}
.link{background:none;border:0;color:var(--primary);cursor:pointer;text-decoration:underline;padding:0}

.items .item{display:flex;gap:.5rem;margin-bottom:.5rem;align-items:flex-start}
.items .item .num{flex:none;width:1.8rem;text-align:center;padding-top:.45rem;color:var(--muted);font-weight:700}
.items .item>div.f{flex:1;display:grid;gap:.5rem}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:2fr 1fr 1.3fr}.ct{grid-template-columns:2fr 1.2fr 1fr}
@media(max-width:640px){.c2,.c3,.ct{grid-template-columns:1fr}}

.list-table{width:100%;border-collapse:collapse}
.list-table th,.list-table td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.list-table th{font-size:.85rem;color:var(--muted)}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:.05rem .6rem;border-radius:99px;font-size:.8rem;background:#e5e7eb}
.badge.ok{background:#d1fae5;color:#065f46}.badge.off{background:#fee2e2;color:#991b1b}.badge.adm{background:#dbeafe;color:#1e40af}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;color:#1f2937;border-radius:99px;padding:.35rem 1rem;cursor:pointer}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.ai-box{border:2px dashed var(--primary);background:color-mix(in srgb,var(--primary) 6%,#fff)}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem 1rem;display:flex;gap:.6rem;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
canvas.pad{border:1px dashed #9ca3af;border-radius:10px;background:#fff;width:100%;max-width:420px;height:140px;touch-action:none;display:block}

#toast{position:fixed;bottom:1.2rem;inset-inline-start:50%;transform:translateX(50%);background:#111827;color:#fff;padding:.6rem 1.2rem;border-radius:10px;z-index:99;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto;margin:0}

/* ---------- ورقة المحضر ---------- */
.paper-wrap{overflow-x:auto;padding-bottom:1rem}
.paper{background:#fff;color:#111;width:190mm;margin:0 auto;padding:6mm 4mm;font-size:12.5pt;line-height:1.8;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.paper.exporting{box-shadow:none}
.paper .doc-head{text-align:center;margin-bottom:5mm}
.paper .doc-head img{max-height:22mm;max-width:45mm}
.paper .org{font-weight:700;font-size:13pt}
.paper h1{color:var(--primary);font-size:21pt;margin:1mm 0}
.paper h2{font-size:15pt;margin:0}
.paper h3{color:var(--primary);font-size:14pt;border-bottom:2px solid var(--primary);padding-bottom:1mm;margin:6mm 0 3mm}
.paper p{margin:0 0 2mm;text-align:justify}
.paper table{width:100%;border-collapse:collapse;margin-bottom:2mm}
.paper th,.paper td{border:1px solid #999;padding:1.6mm 2.5mm;vertical-align:middle;text-align:start;word-break:break-word}
.paper thead th{background:var(--primary);color:#fff;text-align:center}
.paper td:first-child{text-align:center}
.paper table.info th{background:#f1f3f5;width:26%;text-align:start}
.paper table.info td:first-child{text-align:start}
.paper ol{margin:0;padding-inline-start:7mm}
.paper li{margin-bottom:1.5mm}
.paper .sign{margin-top:12mm;display:grid;gap:3mm;page-break-inside:avoid}
.paper .sig{display:flex;align-items:flex-end;gap:3mm}
.paper .sig img{max-height:22mm;max-width:60mm}
.paper .sig .line{display:inline-block;width:60mm;border-bottom:1px dotted #333;height:10mm}

@media print{
  body{background:#fff}
  .topbar,.demo,.bar,.no-print,#toast{display:none!important}
  main{max-width:none;padding:0}
  .paper{box-shadow:none;width:auto;padding:0}
  .paper tr,.paper h3,.paper .sign{page-break-inside:avoid}
  .paper thead th,.paper table.info th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:15mm 12mm}
}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:4rem">جاري التحميل…</p></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/docx.js" defer></script>
<script src="vendor/jspdf.js" defer></script>
<script src="backend.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
